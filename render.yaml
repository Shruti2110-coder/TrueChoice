# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repo
services:
  # ---------- Express API ----------
  - type: web
    name: truechoice-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/test
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set these two in the Render dashboard - never commit them
      - key: MONGODB_URL
        sync: false
      # Set to your static site's URL once it exists, e.g.
      # https://truechoice-web.onrender.com
      - key: CORS_ORIGIN
        sync: false
      # Render generates a strong secret and keeps it out of the repo
      - key: JWT_SECRET
        generateValue: true

  # ---------- React frontend ----------
  - type: web
    name: truechoice-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: truechoice-api
          property: host
    routes:
      # Single-page app: let React Router handle every path
      - type: rewrite
        source: /*
        destination: /index.html
